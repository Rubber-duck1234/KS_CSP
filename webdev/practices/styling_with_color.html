<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Styling_with_color</title>
        <meta charset="UTF-8">
        <style>
            #one{
                border: 8px solid blue;
                height: 250px;
                width: 250px;
                background-color: orange;
                color: white;
                font-size: 2em;
            }
            #two{
                border: 8px solid green;
                height: 250px;
                width: 250px;
                background-color: yellowgreen;
                color: yellow;
                font-size: 2em;
            }
            #three{
                border: 8px solid red;
                height: 250px;
                width: 250px;
                background-color: blue;
                color: yellow;
                font-size: 2em;
            }
        </style>
    </head>
    <body>
        <div id="one">
            <p>Complementary colors.</p>
        </div>
        <div id="two">
            <p>Analogus colors.</p>
        </div>
        <div id="three">
            <p>Triadic box.</p>
        </div>
    </body>





</html>
